<p>우리집노트 주소가 바뀌었어요.<br><a href="https://joonseonhwang.github.io/house/">새 주소로 이동</a></p>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){

});
location.replace('https://joonseonhwang.github.io/house/');
</script>
